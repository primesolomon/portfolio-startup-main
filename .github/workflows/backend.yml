name: Backend checks

on:
  push:
    paths:
      - "portfolio/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "portfolio/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: portfolio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit
